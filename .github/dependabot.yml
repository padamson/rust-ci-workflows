version: 2
updates:
  # The action pins inside the reusable workflows. A bump here reaches the
  # repos that call them only through a release of this repo and then
  # Dependabot's bump of each caller's pin, so nothing auto-merges here:
  # each PR is read and merged by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Only default-days here: Dependabot's schema rejects the per-semver keys
    # for github-actions, and one bad key invalidates this whole file.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # The fixture crate's Cargo.lock. It has no dependencies, so this entry
  # has nothing to do until one is added.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
